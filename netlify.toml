[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the Render backend so the browser sees one origin
# (first-party cookies, no CORS). Replace the host with your Render service URL.
[[redirects]]
  from = "/api/*"
  to = "https://personal-2-phi0.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
